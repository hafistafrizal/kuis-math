<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Quiz Math</title>
</head>
<body>
    <div class="main-content">

        <div class="bezel-layar">
            <div class="bezel-top">
                <span>LIVE</span>
                <button id="btn-edit-nama">NAMA</button>
            </div>
            <!-- LAYAR KUIS MATH -->
            <div class="layar-kuis" id="layar-kuis">
                
                <div class="status-info">
                    <h2>KUIS MATEMATIKA</h2>

                    <div class="status-row">
                        <p>> nama </p>
                        <span id="nama-user"></span>
                    </div>
                    <div class="status-row">
                        <p>> operasi </p>
                        <span id="layar-operasi"></span>
                    </div>
                    <div class="status-row">
                        <p>> speed </p>
                        <span id="layar-speed"></span>
                    </div>
                    <div class="status-row">
                        <p>> mode </p>
                        <span id="layar-mode"></span>
                    </div>
                    <div class="status-row">
                        <p>> level </p>
                        <span id="angka-slider"> 1</span>
                    </div>
                    <!-- <div class="status-row">
                        <p>> Status </p>
                        <span id="layar-status">ISI NAMA</span>
                    </div> -->
                </div>
            </div>
        </div>

        <!-- BUTTON OPERASI KUIS-->
        <form action="quiz.html" method="GET" onsubmit="return validasiFormKuis()">
            <p class="title-section">Pilih Operasi :</p>
            
            <div class="grid-operasi">
                <div class="radio-item">
                    <input type="radio" id="penjumlahan" name="jenis-operasi" value="penjumlahan" onchange="gantiLayar('layar-operasi', '+ Tambah')">
                    <label for="penjumlahan" class="label-blue">penjumlahan</label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="pengurangan" name="jenis-operasi" value="pengurangan" onchange="gantiLayar('layar-operasi', '- kurang')">
                    <label for="pengurangan" class="label-red">Pengurangan</label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="perkalian" name="jenis-operasi" value="perkalian" onchange="gantiLayar('layar-operasi', 'x kali')">
                    <label for="perkalian" class="label-green">Perkalian</label>
                </div>
                        
                <div class="radio-item">
                    <input type="radio" id="pembagian" name="jenis-operasi" value="pembagian" onchange="gantiLayar('layar-operasi', '/ bagi')">
                    <label for="pembagian" class="label-gold">Pembagian</label>
                </div>
            </div>
                    
            <!-- INPUT WAKTU PENGERJAAN -->
            <p class="title-section">Waktu Pengerjaan:</p>

            <div class="grid-timer">
                <div class="radio-item">
                    <input type="radio" name="speed-timer" id="slow" value="slow" onchange="gantiLayar('layar-speed', '120 detik')">
                    <label for="slow" class="label-dark">Lambat</label>
                </div>

                <div class="radio-item">
                    <input type="radio" name="speed-timer" id="medium" value="normal" onchange="gantiLayar('layar-speed', '90 detik')">
                    <label for="medium" class="label-dark">Normal</label>
                </div>

                <div class="radio-item">
                    <input type="radio" name="speed-timer" id="fast" value="fast" onchange="gantiLayar('layar-speed', '60 detik')">
                    <label for="fast" class="label-dark">Cepat</label>
                </div>
            </div>

            <!-- INPUT RANGE -->
            <p class="title-section">Mode:</p>
            <div class="grid-operasi">
                <div class="radio-item">
                    <input type="radio" id="pilih-jawaban" name="mode-kuis" value="pilih-jawaban" onchange="gantiLayar('layar-mode', 'Pilihan')">
                    <label for="pilih-jawaban" class="label-green">pilih</label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="input-jawaban" name="mode-kuis" value="input-jawaban" onchange="gantiLayar('layar-mode', 'Input')">
                    <label for="input-jawaban" class="label-red">input</label>
                </div>
            </div>

            <!-- INPUT RANGE ANGKA KUIS -->
            <div class="range-number">
                <div class="title-range">
                    <div class="title-section">
                       <p> Range Angka: </p>
                    </div>
                    <div class="title-section">
                        <p>1-10</p>
                    </div>
                </div>

                <div class="stepper-level">
                    <button type="button" class="btn-3d label-red" onclick="kurangLevel()">-</button>
                    <span id="angka-level">1</span>
                    <button type="button" class="btn-3d label-blue" onclick="tambahLevel()">+</button>
                </div>
            </div>

            <input type="hidden" name="nama-user" id="hidden-nama">
            <input type="hidden" name="angka-level" id="hidden-level" value="1">
            
            <hr>

            <div class="button-start">
                <button type="submit" class="btn-start label-main-button">Mulai</button>
            </div>
        </form>
    </div>
</body>

    <!-- MODAL NAMA -->
     <div id="modal-nama" class="modal-overlay">
        <div class="modal-box">
            <h2>Masukkan Nama Anda:</h2>
            <input type="text" name="input-nama" id="input-nama" class="input-manual" placeholder="Nama Panggilan Anda..">
            <button type="button" class="btn-start label-main-button" onclick="simpanNama()">Simpan</button>
        </div>
     </div>

    <div id="modal-peringatan" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="text-align: center;">
            <h2 id="text-peringatan" class="text-peringatan"></h2>
            <button type="button" class="btn-start label-main-button" onclick="tutupPeringatan()">OK</button>
        </div>
    </div>

</html>

<script src="./script.js?=v1"></script>
