<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Quiz Math</title>
</head>
<body>
    <div class="main-content">

        <div class="bezel-layar">
            <div class="bezel-top">
                <span>LIVE</span>
                <button id="btn-edit-nama">NAMA</button>
            </div>
            <!-- LAYAR KUIS MATH -->
            <div class="layar-kuis" id="layar-kuis">

                <div class="status-info menu-game">

                    <div class="menu-judul">
                        <span class="menu-judul-kecil">KUIS</span>
                        <h2 class="menu-judul-besar">MATEMATIKA</h2>
                    </div>

                    <div class="menu-pemain">
                        <span class="menu-pemain-nama"><span id="nama-user"></span></span>
                        <span class="menu-level">
                            LV <span id="bar-level" class="menu-bar"></span> <span id="angka-slider">1</span>
                        </span>
                    </div>

                    <div class="menu-slot-grup">
                        <div class="menu-slot">
                            <span class="menu-label">OPERASI</span>
                            <span id="layar-operasi" class="menu-nilai"></span>
                        </div>
                        <div class="menu-slot">
                            <span class="menu-label">WAKTU</span>
                            <span id="layar-speed" class="menu-nilai"></span>
                        </div>
                        <div class="menu-slot">
                            <span class="menu-label">MODE</span>
                            <span id="layar-mode" class="menu-nilai"></span>
                        </div>
                    </div>

                    <p id="layar-status" class="menu-status">ISI NAMA</p>
                </div>
            </div>
        </div>

        <!-- BUTTON OPERASI KUIS-->
        <form action="quiz.html" method="GET" id="form-kuis">
            <p class="title-section">Pilih Operasi :</p>
            
            <div class="grid-operasi">
                <div class="radio-item">
                    <input type="radio" id="penjumlahan" name="jenis-operasi" value="penjumlahan" data-target="layar-operasi" data-text="+ Tambah">
                    <label for="penjumlahan" class="label-blue">penjumlahan</label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="pengurangan" name="jenis-operasi" value="pengurangan" data-target="layar-operasi" data-text="- Kurang">
                    <label for="pengurangan" class="label-red">Pengurangan</label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="perkalian" name="jenis-operasi" value="perkalian" data-target="layar-operasi" data-text="x Kali">
                    <label for="perkalian" class="label-green">Perkalian</label>
                </div>
                        
                <div class="radio-item">
                    <input type="radio" id="pembagian" name="jenis-operasi" value="pembagian" data-target="layar-operasi" data-text="/ Bagi">
                    <label for="pembagian" class="label-gold">Pembagian</label>
                </div>
            </div>
                    
            <!-- INPUT WAKTU PENGERJAAN -->
            <p class="title-section">Waktu Pengerjaan:</p>

            <div class="grid-timer">
                <div class="radio-item">
                    <input type="radio" name="speed-timer" id="slow" value="slow" data-target="layar-speed" data-text="120 detik">
                    <label for="slow" class="label-dark">Lambat</label>
                </div>

                <div class="radio-item">
                    <input type="radio" name="speed-timer" id="medium" value="normal" data-target="layar-speed" data-text="90 detik">
                    <label for="medium" class="label-dark">Normal</label>
                </div>

                <div class="radio-item">
                    <input type="radio" name="speed-timer" id="fast" value="fast" data-target="layar-speed" data-text="60 detik">
                    <label for="fast" class="label-dark">Cepat</label>
                </div>
            </div>

            <!-- INPUT MODE -->
            <p class="title-section">Mode:</p>
            <div class="grid-operasi">
                <div class="radio-item">
                    <input type="radio" id="pilih-jawaban" name="mode-kuis" value="pilih-jawaban" data-target="layar-mode" data-text="Pilihan">
                    <label for="pilih-jawaban" class="label-green">pilih</label>
                </div>

                <div class="radio-item">
                    <input type="radio" id="input-jawaban" name="mode-kuis" value="input-jawaban" data-target="layar-mode" data-text="Input">
                    <label for="input-jawaban" class="label-red">input</label>
                </div>
            </div>

            <!-- INPUT RANGE ANGKA KUIS -->
            <div class="range-number">
                <div class="title-range">
                    <div class="title-section">
                       <p> Range Angka: </p>
                    </div>
                    <div class="title-section">
                        <p>1-10</p>
                    </div>
                </div>

                <div class="stepper-level">
                    <button type="button" class="btn-3d label-red" id="level-kurang">-</button>
                    <span id="angka-level">1</span>
                    <button type="button" class="btn-3d label-blue" id="level-tambah">+</button>
                </div>
            </div>

            <input type="hidden" name="nama-user" id="hidden-nama">
            <input type="hidden" name="angka-level" id="hidden-level" value="1">
            
            <hr>

            <div class="button-start">
                <button type="submit" class="btn-start label-main-button">Mulai</button>
            </div>
        </form>
    </div>
</body>

    <!-- MODAL NAMA -->
     <div id="modal-nama" class="modal-overlay">
        <div class="modal-box">
            <h2>Masukkan Nama Anda:</h2>
            <input type="text" name="input-nama" id="input-nama" class="input-manual" placeholder="Nama Panggilan Anda..">
            <button type="button" class="btn-start label-main-button" id="simpan-nama">Simpan</button>
        </div>
     </div>

    <div id="modal-peringatan" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="text-align: center;">
            <h2 id="text-peringatan" class="text-peringatan"></h2>
            <button type="button" class="btn-start label-main-button" id="tutup-modal">OK</button>
        </div>
    </div>

</html>

<script type="module" src="./js/menu.js"></script>
