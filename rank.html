<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <title>Quiz Math - Rank</title>
</head>
<body>
    <div class="main-content">
        <div class="bezel-layar">
            <div class="bezel-top">
                <span>LIVE</span>
            </div>

            <div class="layar-kuis" id="layar-kuis">
                <div id="layar-result" class="tampilan-result-baru">
                    <h2 class="judul-gameover">MATCH RESULT</h2>
                    <p class="pemain-teks">PLAYER: <span id="nama-user"></span></p>
    
                    <div class="wadah-skor-besar">
                        <p class="teks-kecil">FINAL SCORE</p>
                        <h1 id="papan-skor" class="angka-raksasa">0</h1>
                        <p class="teks-kecil rekor-teks">HI-SCORE: <span id="papan-rekor">0</span></p>
                    </div>
    
                    <div class="info-bawah-result">
                        <div>LEVEL: <span id="level-game"></span></div>
                        <div>MODE: <span id="waktu-game"></span></div>
                    </div>
                </div>
                
                <div id="layar-leaderboard" style="display: none; height: 100%;">
                    <h3 class="judul-gameover">TOP PLAYER</h3>
                    <div class="layar-leaderboard">
                        <table class="tabel-peringkat">
                            <thead>
                                <tr>
                                    <th>NO</th>
                                    <th>NAME</th>
                                    <th>SCORE</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="juara">
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </tbody>
                            <tfoot>
                                
                            </tfoot>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="grid-operasi">
            <button type="button" class="btn-start label-gold" id="ganti-layar-papan" onclick="gantiPapan()">Peringkat</button>
            <button type="button" class="btn-start label-green" id="" onclick="backQuiz()">Main Lagi</button>
        </div>

        <hr>

        <button type="button" class="btn-3d label-dark" onclick="backHome()">Kembali Ke Beranda</button>
    </div>
</body>
</html>

<script src="./script.js?=v1">

</script>
