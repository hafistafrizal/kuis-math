<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">

    <title>Quiz Math</title>
</head>
<body>
    <div class="container">
        <div class="main-content">

            <!-- LAYAR KUIS MATH -->
            <div class="layar-kuis" id="layar-kuis">
                <h2 id="header-operasi"></h2>
                
                <div class="kuis-info">
                    <p id="nama-user">>nama: </p>

                    <div class="papan-user">
                        <p id="papan-skor">0 Skor</p>
                        <span id="indikator-skor"></span>
                        <p>|</p>
                        <p id="papan-waktu">0 Dtk</p>
                    </div>
                </div>

                <div class="kuis-games">
                    <div class="nilai-operator" id="area-soal">
                        <p id="nilai1" name="nilai1">0</p>
                        <span id="operasi"></span>
                        <p id="nilai2" name="nilai2">0</p>
                        <p> = </p>
                    </div>

                    <div class="jawab" id="area-jawaban">
                        <p id="jawaban-layar" name="jawaban-layar"></p>
                    </div>

                    <p id="pesan-tengah" style="display: none; color: var(--bg-screen);">SALAH!!</p>
                </div>

            </div>
        
            <form action="">
            
                <div class="start-kuis">
                    <button type="button" id="generate-kuis" class="btn-3d btn-start" onclick="generateKuis()">Mulai Quiz Math</button>
                </div>
                
                <div id="grub-aksi">
                    <div id="mode-pilihan">
                        <p class="title-section">Pilih Jawaban:</p>
                        <div class="grid-operasi">
                            <button type="button" id="aksi-1" class="btn-3d-games label-blue" onclick="checkAnswer(this.innerText)"></button>
                            <button type="button" id="aksi-2" class="btn-3d-games label-red" onclick="checkAnswer(this.innerText)"></button>
                            <button type="button" id="aksi-3" class="btn-3d-games label-green" onclick="checkAnswer(this.innerText)"></button>
                            <button type="button" id="aksi-4" class="btn-3d-games label-gold" onclick="checkAnswer(this.innerText)"></button>
                        </div>
                    </div>
                    
                    <div id="mode-input">
                        <input type="number" id="jawaban-user" name="jawaban-user" class="input-content" placeholder="Jawaban Anda">
                        
                        <div class="grid-operasi">
                            <button type="button" class="btn-3d-games label-red" onclick="formReset()">Cancel</button>
                            <button type="button" class="btn-3d-games label-green" onclick="inputJawaban()">Submit</button>
                        </div>
                    </div>
                </div>

                <hr>

                <button type="button" onclick="backHome()" class="btn-3d label-dark">Kembali ke Beranda</button>
            </form>
        </div>
    </div>

</body>
</html>

<script src="./script.js"></script>
