<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="./style.css">
        <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">

        <title>Quiz Math - Game</title>
    </head>
    <body>
        <div class="main-content" id="area-kuis">
            
            <div class="bezel-layar">
                <div class="bezel-top">
                    <span>LIVE</span>
                </div>
                
                <!-- LAYAR KUIS MATH -->
                <!-- <div class="layar-kuis" > -->

                    <div class="layar-gameplay" id="layar-kuis">
                        <div class="status-game">
                            <div id="papan-nyawa" class="status-kiri container-nyawa">
                                <div class="nyawa-img"></div>
                                <div class="nyawa-img"></div>
                                <div class="nyawa-img"></div>
                            </div>
                            
                            <div id="papan-waktu" class="wadah-waktu">
                                <span id="waktu-global" class="teks-waktu-utama">0</span>
                                <span id="waktu-soal" class="teks-waktu-detik">0</span>
                            </div>

                            <div class="status-kanan">
                                <span id="indikator-skor"></span>
                                <span id="papan-skor">0 Score</span>
                            </div>
                        </div>

                        <div class="kuis-games">
                            <div id="area-soal">
                                <span id="nilai1" name="nilai1">0</span>
                                <span id="operasi"></span>
                                <span id="nilai2" name="nilai2">0</span>
                                <span> = </span>
                            </div>
                            <div id="area-jawaban">
                                <span id="jawaban-layar" name="jawaban-layar" class="kotak-jawaban">?</span>
                            </div>
                            
                            <p id="pesan-tengah" style="display: none; color: var(--bg-screen);">SALAH!!</p>
                            
                        </div>

                        <div class="status-bawah-game">
                            <span>Name: <span id="nama-user"></span> </span>
                            <span>Level: <span id="level-game"></span></span>
                        </div>
                    </div>
            </div>
        
        <form action="" onsubmit="event.preventDefault()">
            
            <div class="start-kuis">
                <button type="button" id="generate-kuis" class="btn-start label-main-button">Mulai Quiz Math</button>
            </div>
            
            <div id="grub-aksi">
                <div id="mode-pilihan">
                    <p class="title-section">Pilih Jawaban:</p>
                    <div class="grid-operasi">
                        <button type="button" id="aksi-1" class="btn-3d-games label-blue"></button>
                        <button type="button" id="aksi-2" class="btn-3d-games label-red"></button>
                        <button type="button" id="aksi-3" class="btn-3d-games label-green"></button>
                        <button type="button" id="aksi-4" class="btn-3d-games label-gold"></button>
                    </div>
                </div>
                
                <div id="mode-input">
                    <p class="title-section">Ketik Jawaban:</p>
                    <input type="number" id="jawaban-user" name="jawaban-user" class="input-manual" placeholder="Jawaban Anda">
                    
                    <div class="grid-operasi">
                        <button type="button" class="btn-3d-games label-red" id="btn-reset-form">Hapus</button>
                        <button type="button" class="btn-3d-games label-green" id="btn-input-jawaban">Submit</button>
                    </div>
                </div>
            </div>
            
            <div class="grid-operasi" id="tombol-gameover" style="display: none;">
                <button type="button" class="btn-start label-disabled" disabled>Peringkat</button>
                <button type="button" class="btn-start label-disabled" disabled>Main Lagi</button>
            </div>

            <hr>
            
            <button type="button" id="btn-back-home" class="btn-3d label-dark">Kembali ke Beranda</button>
        </form>
    </div>

</body>

        <div class="modal-box" style="text-align: center;">
            <h2 id="text-peringatan" class="text-peringatan"></h2>
            <div class="grid-operasi">
                <button type="button" class="btn-3d-games label-red" id="btn-back-home">BACK HOME</button>
                <button type="button" class="btn-3d-games label-gold" id="tutup-modal">COBA LAGI</button>
            </div>
        </div>
    </div> -->

</html>
