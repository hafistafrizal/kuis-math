<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
    <!-- Outline Body Gameboy (Gelap) -->
    <rect x="2" y="1" width="12" height="14" rx="1" fill="#0f380f" />
    <!-- Inner Body Gameboy (Terang) -->
    <rect x="3" y="2" width="10" height="12" fill="#8bac0f" />
    
    <!-- Bezel Layar (Gelap) -->
    <rect x="4" y="3" width="8" height="5" fill="#0f380f" />
    <!-- Layar Utama (Terang) -->
    <rect x="5" y="4" width="6" height="3" fill="#8bac0f" />
    
    <!-- D-Pad / Tombol Arah (Gelap) -->
    <rect x="4" y="10" width="3" height="1" fill="#0f380f" />
    <rect x="5" y="9" width="1" height="3" fill="#0f380f" />
    
    <!-- Tombol A dan B (Gelap) -->
    <rect x="11" y="9" width="1" height="1" fill="#0f380f" />
    <rect x="9" y="10" width="1" height="1" fill="#0f380f" />
</svg>
